[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for images and icons; HTML is revalidated on every request.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Short aliases -> canonical legal URLs
[[redirects]]
  from = "/terms"
  to = "/terms-of-service"
  status = 301
[[redirects]]
  from = "/privacy"
  to = "/privacy-policy"
  status = 301
